  </g>
  <text x="100" y="565" fill="#f8fafc" font-family="Arial, sans-serif" font-size="76" font-weight="700">airticket-compare</text>
  <text x="104" y="615" fill="#94a3b8" font-family="Arial, sans-serif" font-size="30">Multi-platform flight price comparison</text>
</svg>
