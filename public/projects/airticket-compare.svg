<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" fill="#08101a"/>
  <rect x="70" y="70" width="1060" height="580" rx="30" fill="#0d1626" stroke="#1e3a5f" stroke-width="2"/>
  <circle cx="900" cy="210" r="130" fill="#3b82f6" opacity=".16"/>
  <circle cx="255" cy="492" r="190" fill="#06b6d4" opacity=".12"/>
  <!-- plane icon -->
  <g transform="translate(140,150) rotate(35)" fill="#60a5fa">
    <path d="M0 40 L120 30 L150 20 L150 60 L120 50 L0 40 Z"/>
    <path d="M70 25 L95 0 L95 30 Z"/>
    <path d="M70 55 L95 90 L95 55 Z"/>
  </g>
  <!-- comparison chart frame -->
  <rect x="180" y="180" width="840" height="300" rx="18" fill="#0a1320" stroke="#3b82f6" stroke-width="3"/>
  <line x1="260" y1="430" x2="980" y2="430" stroke="#1e3a5f" stroke-width="2"/>
  <!-- 4 platform bars -->
  <g font-family="Arial, sans-serif" font-size="26" font-weight="700">
    <text x="200" y="260" fill="#93c5fd">携程</text>
    <rect x="270" y="240" width="420" height="32" rx="8" fill="#3b82f6"/>
