    <text x="200" y="312" fill="#93c5fd">飞猪</text>
    <rect x="270" y="292" width="360" height="32" rx="8" fill="#60a5fa"/>
    <text x="640" y="317" fill="#bfdbfe">¥595</text>

    <text x="200" y="364" fill="#67e8f9">同程</text>
    <rect x="270" y="344" width="300" height="32" rx="8" fill="#22d3ee"/>
    <text x="580" y="369" fill="#a5f3fc">¥498</text>

    <text x="200" y="416" fill="#67e8f9">去哪儿</text>
    <rect x="270" y="396" width="340" height="32" rx="8" fill="#06b6d4"/>
