  <!-- chip pins -->
  <g fill="#a855f7">
    <rect x="222" y="245" width="28" height="10" rx="3"/><rect x="222" y="280" width="28" height="10" rx="3"/><rect x="222" y="315" width="28" height="10" rx="3"/><rect x="222" y="350" width="28" height="10" rx="3"/><rect x="222" y="385" width="28" height="10" rx="3"/>
    <rect x="450" y="245" width="28" height="10" rx="3"/><rect x="450" y="280" width="28" height="10" rx="3"/><rect x="450" y="315" width="28" height="10" rx="3"/><rect x="450" y="350" width="28" height="10" rx="3"/><rect x="450" y="385" width="28" height="10" rx="3"/>
  </g>
